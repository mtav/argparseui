[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "argparseui"
dynamic = ["version"]
description = "Auto generate ui for argparse based command-line tools"
readme = "README.txt"
authors = [
    { name = "Stefaan Himpe", email = "stefaan.himpe@gmail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Utilities",
]
dependencies = ["PyQt5"]

[project.urls]
Homepage = "https://github.com/shimpe/argparseui"

[tool.setuptools]
packages = ["argparseui"]

[tool.setuptools.dynamic]
version = { attr = "argparseui._version.__VERSION__" }
